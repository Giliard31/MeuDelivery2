<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery App - Painel Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: #f7f9fb; color: #2d3748; display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: #1a365d; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .main-container { flex: 1; max-width: 900px; width: 100%; margin: 0 auto; padding: 30px 20px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #edf2f7; font-size: 14px; }
        th { background-color: #2b6cb0; color: white; }
        .btn-aprovar { background: #38a169; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>⚙️ Painel Admin Principal</h1>
        <a href="index.html" style="color:white; text-decoration:none; font-weight:bold;">Voltar ao App</a>
    </header>

    <div class="main-container">
        <h2>Aprovação de Lojas</h2>
        <table>
            <thead>
                <tr>
                    <th>Restaurante</th>
                    <th>E-mail</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tabela-lojas"></tbody>
        </table>
    </div>

    <script>
        const URL_API = "https://SEU-PROJETO.onrender.com";

        async function carregarLojasAdmin() {
            try {
                const res = await fetch(`${URL_API}/api/lojas`);
                const lojas = await res.json();
                const tbody = document.getElementById('tabela-lojas');
                tbody.innerHTML = '';

                lojas.forEach(loja => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${loja.nome}</td>
                            <td>${loja.email}</td>
                            <td>
                                ${loja.aprovada ? 'Aprovada ✅' : `<button class="btn-aprovar" onclick="aprovarLoja('${loja.email}')">Aprovar</button>`}
                            </td>
                        </tr>
                    `;
                });
            } catch (e) {
                console.error("Erro ao carregar lojas admin:", e);
            }
        }

        async function aprovarLoja(email) {
            try {
                await fetch(`${URL_API}/api/admin/aprovar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                alert('Loja aprovada com sucesso!');
                carregarLojasAdmin();
            } catch (e) {
                alert('Erro ao aprovar loja.');
            }
        }

    carregarLojasAdmin();
    </script>
</body>
</html>
